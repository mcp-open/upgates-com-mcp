        - { key: api_login, label: "API login" }
        - { key: api_key, label: "API klíč" }
      tools:
        - { name: list_orders, description: "Objednávky s filtry a pseudonymizovanými zákaznickými údaji" }
        - { name: get_order_history, description: "Historie konkrétní objednávky" }
        - { name: list_order_statuses, description: "Stavy objednávek" }
        - { name: list_invoices, description: "Faktury s chráněnými zákaznickými údaji" }
        - { name: list_products, description: "Produkty s filtry a stránkováním" }
