slug: upgates
name: Upgates
version: 0.2.0
category: ecommerce
summary: >
  Čtecí přístup k Upgates e-shop API (v2) — objednávky, faktury, produkty,
  zákazníci, kategorie, košíky, doprava, platby a konfigurace e-shopu.
  Zákaznická osobní data (e-maily, telefony, jména, adresy, IČO/DIČ,
  bankovní spojení) jsou před odpovědí pseudonymizována na stabilní tokeny
  typu <EMAIL_3f9c1a2b4d5e>, takže do LLM neproteče PII (GDPR).
sdk_min_version: 0.4.2

credentials:
  - key: api_url
    label: URL API e-shopu
    type: string
    secret: false
    required: true
    hint: "Přesná URL z administrace Upgates, např. https://vas-eshop.admin.server.upgates.com/api/v2"
  - key: api_login
    label: API login
    type: string
    secret: false
    required: true
    hint: "Přihlašovací jméno API klíče (Upgates → Nastavení → API)"
  - key: api_key
    label: API klíč
    type: string
    secret: true
    required: true
    hint: "API klíč (heslo) k Upgates API — Upgates → Nastavení → API"

operator_config: []

capabilities:
  default_read_only: true
  supports_test: true
  supports_write: false

# display (manifest.display) — kurátorovaný verejný manifest pro web detail.
display:
  schema_version: 1
  capabilities:
    - "Číst objednávky, faktury, produkty, zákazníky a kategorie z Upgates e-shopu"
    - "Číst košíky, dopravu, platby, slevové kupóny a konfiguraci e-shopu"
    - "Použít výsledky přímo v konverzaci s AI"
  permissions:
    - "Pouze čtení (GET) přes Upgates API v2 — konektor nezapisuje ani nemaže data"
    - "Vyžaduje API login a klíč e-shopu (uložený write-only v trezoru, v DB jen maska)"
  data_handling: "Osobní údaje zákazníků (e-maily, telefony, jména, adresy, IČO/DIČ, bankovní spojení) jsou před odesláním do LLM pseudonymizovány na stabilní tokeny (např. <EMAIL_3f9c1a2b4d5e>). Token je odvozen jednosměrně (HMAC) a nelze ho rozklíčovat zpět — nikde nevzniká re-identifikační mapa. Katalogová data (produkty, kategorie, ceny) se nepseudonymizují."
  example_query: "Ukaž mi posledních 10 objednávek a jejich stav."
  tools:
    - name: list_orders
      description: "Seznam objednávek s filtry a stránkováním — zákaznická data jsou pseudonymizována"
    - name: get_order_history
      description: "Historie konkrétní objednávky"
    - name: list_order_statuses
      description: "Seznam stavů objednávek"
    - name: list_invoices
      description: "Seznam faktur — zákaznická data jsou pseudonymizována"
    - name: list_products
      description: "Seznam produktů s filtry a stránkováním"
    - name: list_products_simple
      description: "Seznam produktů ve zjednodušeném formátu"
    - name: list_customers
      description: "Seznam zákazníků — osobní údaje jsou pseudonymizovány"
    - name: list_categories
      description: "Seznam kategorií"
    - name: list_labels
      description: "Seznam produktových štítků"
    - name: list_availabilities
      description: "Seznam dostupností produktů"
    - name: list_manufacturers
      description: "Seznam výrobců"
    - name: list_parameters
      description: "Seznam produktových parametrů"
    - name: list_carts
      description: "Seznam košíků — zákaznická data jsou pseudonymizována"
    - name: list_vouchers
      description: "Seznam slevových kupónů"
    - name: list_shipments
      description: "Seznam způsobů dopravy"
    - name: list_payments
      description: "Seznam platebních metod"
    - name: list_webhooks
      description: "Seznam nakonfigurovaných webhooků"
    - name: list_webhook_events
      description: "Seznam dostupných webhook událostí"
    - name: get_languages
      description: "Jazyky e-shopu"
    - name: get_shop_config
      description: "Konfigurace a nastavení e-shopu"
    - name: get_shop_owner
      description: "Fakturační údaje provozovatele e-shopu (pseudonymizované)"
    - name: get_api_status
      description: "Stav API a seznam povolených endpointů pro aktuálního uživatele"
    - name: list_pricelists
      description: "Seznam ceníků"
  locales:
    cs:
      name: "Upgates"
      description: "Čtecí propojení s Upgates e-shopem pro objednávky, faktury, produkty, zákazníky, košíky, dopravu, platby a nastavení."
      capabilities:
        - "Číst objednávky, faktury, produkty, zákazníky a kategorie"
        - "Číst košíky, dopravu, platby, kupóny a konfiguraci e-shopu"
        - "Použít výsledky přímo v konverzaci s podporovaným AI klientem"
      permissions:
        - "Pouze čtení přes Upgates API v2 — konektor nezapisuje ani nemaže data"
        - "Vyžaduje API adresu, login a klíč uložený v chráněném úložišti"
      data_handling: "Osobní údaje zákazníků a provozovatele se vždy před odesláním do AI klienta pseudonymizují stabilními jednosměrnými tokeny. Katalogová data zůstávají čitelná."
      example_query: "Ukaž posledních 10 objednávek, jejich stav a celkovou hodnotu."
      fields:
