[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upgates-mcp"
version = "0.2.1"
description = "Upgates e-shop API (v2) MCP konektor nad openmcp_sdk — port upgates-com-mcp z TypeScriptu (read-only + GDPR anonymizace)."
requires-python = ">=3.12"
# openmcp-sdk se nepublikuje na PyPI — jméno tam patří nesouvisejícímu
# projektu s nejvyšší verzí 0.2.20, takže `pip install` na tomhle balíku
# selhal a po vydání cizí 0.4.x by nainstaloval cizí kód. Reference míří
# přímo na commit, který je zároveň v `.sdk-ref` a ve vendorovaném snapshotu
# v `release/vendor/`; shodu hlídá `tests/test_sdk_pin.py`.
dependencies = [
  "openmcp-sdk @ git+https://github.com/mcp-open/openmcp-sdk@0d36cf1a93c870fe237ecbe3bee7b52b202df18d",
  "fastmcp>=3.2,<4",
  "pydantic>=2.6,<3",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "pyyaml==6.0.2",
  "anyio>=4,<6",
  "ruff==0.15.22",
  "mypy==1.20.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
